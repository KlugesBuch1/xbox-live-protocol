[package]
name = "xbl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Xbox Live authentication and proof-of-possession signing"
repository = "https://github.com/KlugesBuch1/xbox-live-protocol"
readme = "README.md"
rust-version = "1.98"
keywords = ["xbox", "xbox-live"]
categories = ["authentication"]

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
p256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
wiremock = "0.6.5"
