  class: write
  status: 415
  doc: docs/telemetry.md
  summary: OneCollector endpoint referenced by the app's telemetry DLL.
  notes: No request was captured. The string is in ClientTelemetry.dll. A tokenless POST returns 415 because the body is missing.
