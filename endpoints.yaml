  auth: xbl3.0
  class: read
  status: 401
  probe_status: 401
  doc: docs/media.md
  summary: Game DVR clips for an account.
  notes: Returns 401 without a token. The app shows captures on the game page and in the profile. Query parameters and response
    fields are not captured here.
- id: gameclips-me
  area: media
  method: GET
  host: gameclipsmetadata.xboxlive.com
  path: /users/me/clips
  auth: xbl3.0
  class: read
  status: 401
  probe_status: 401
  doc: docs/media.md
  summary: Game DVR clips for the signed-in account.
  notes: Returns 401 without a token. Kept as the me-form of the same service.
- id: screenshots
  area: media
  method: GET
  host: screenshotsmetadata.xboxlive.com
  path: /users/xuid({xuid})/screenshots
  auth: xbl3.0
  class: read
  status: 401
  probe_status: 401
  doc: docs/media.md
  summary: Screenshots for an account.
  notes: Returns 401 without a token. The service is separate from gameclipsmetadata, so a client needs both hosts for a complete
    captures tab.
- id: screenshots-me
  area: media
  method: GET
  host: screenshotsmetadata.xboxlive.com
  path: /users/me/screenshots
  auth: xbl3.0
  class: read
  status: 401
  probe_status: 401
  doc: docs/media.md
  summary: Screenshots for the signed-in account.
  notes: Returns 401 without a token. Same service as the xuid form.
- id: xccs-devices
  area: cloud-gaming
  method: GET
  host: xccs.xboxlive.com
  path: /lists/devices
  auth: xbl3.0
  contract: '4'
  class: read
  status: 200
  probe_status: 401
  doc: docs/cloud-gaming.md
  summary: Consoles and devices linked to the account.
  notes: Returns result[], agentUserId and status. The app uses it for the Consoles panel and remote-play entry points. Empty
    result is normal when no console is linked.
- id: xhome-login
  area: cloud-gaming
  method: POST
  host: xhome.gssv-play-prod.xboxlive.com
  path: /v2/login/user
  auth: none
  class: auth
  status: 200
  doc: docs/cloud-gaming.md
  summary: Cloud-gaming login for console streaming.
  notes: 'Body: {"offeringId":"xhome","token":"..."}. Returns gsToken, market, tokenType and offeringSettings with region
    base URIs. The token is a credential and is redacted in the capture.'
- id: xgpupcapp-login
  area: cloud-gaming
  method: POST
  host: xgpupcapp.gssv-play-prod.xboxlive.com
  path: /v2/login/user
  auth: none
  class: auth
  status: 403
  doc: docs/cloud-gaming.md
  summary: Cloud-gaming login for the PC Game Pass app.
  notes: 'Body: {"offeringId":"XGPUPCAPP","token":"..."}. The captured account received 403 InvalidCountry in Austria. The
    route is live - the offering is region-gated.'
- id: uks-login
  area: cloud-gaming
  method: POST
  host: uks.core.gssv-play-prodxhome.xboxlive.com
  path: /v2/login/user
  auth: none
  class: auth
  status: 200
  doc: docs/cloud-gaming.md
  summary: Regional cloud-gaming login endpoint.
  notes: The xhome login returns this base URI for the UK South region. Body and response match xhome. A client should use
    the baseUri from offeringSettings rather than hard-coding the region.
- id: onecollector-v10
